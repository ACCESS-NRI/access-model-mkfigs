name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    uses: access-nri/actions/.github/workflows/release-python-package.yml@main
    needs: ci
    secrets: inherit
    permissions:
      contents: write
    with:
      pypi-package: true
      conda-package: false
      version-prefix: v
