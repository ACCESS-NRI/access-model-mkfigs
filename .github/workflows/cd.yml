name: CD

on:
  push:
    tags:
      - '**'
  pull_request: # TODO: Remove after testing

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    uses: access-nri/actions/.github/workflows/release-python-package.yml@davide/create-python-release-workflow # TODO: Change branch to `main` after testing
    needs: ci
    secrets: inherit
    permissions:
      contents: write
    with:
      conda-package: false
      dry-run: true # TODO: Remove after testing
