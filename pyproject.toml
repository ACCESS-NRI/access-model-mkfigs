[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "access-model-mkfigs"
version = "0.1.0"
description = "Evaluation figure workflow tools for ACCESS model paper repositories"
readme = "README.md"
authors = [
  {name = "ACCESS-NRI and contributors", email = "chris.bull@anu.edu.au"}
]
maintainers = [
  {name = "ACCESS-NRI and contributors", email = "chris.bull@anu.edu.au"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["ACCESS", "ocean model", "figures", "Figshare", "mkdocs"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
  "pyyaml",
  "requests",
  "matplotlib",
  "papermill",
  "nbconvert",
  "nci_ipynb",
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "pytest",  # testing
    "responses",  # mocks requests.request/.put for the Figshare-API test double in tests/conftest.py
    "ruff"  # linting
    ]
docstest = [
    # Only needed for tests/test_mkdocs_build_offline.py, which skips
    # itself gracefully if these aren't installed. Kept separate from
    # `dev` so the fast unit/integration layer never needs mkdocs at all.
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.11",
    "mkdocs-jupyter>=0.24.0",
    ]

[project.scripts]
mkfigs-run              = "mkfigs.run:main"
mkfigs-pushit           = "mkfigs.pushit:main"
mkfigs-restore          = "mkfigs.restore:main"
mkfigs-fetch-notebooks  = "mkfigs.fetch:main"

[project.urls]
bugs = "https://github.com/ACCESS-NRI/access-model-mkfigs/issues"
changelog = "https://github.com/ACCESS-NRI/access-model-mkfigs/blob/main/HISTORY.rst"
homepage = "https://github.com/ACCESS-NRI/access-model-mkfigs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]




[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"


[tool.coverage.run]
omit = [
    "*/_version.py",
    "*/data/__init__.py",
]
